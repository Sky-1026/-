<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>给你的爱心</title>

<style>
  :root{
    --bg:#07060a;
    --pink:#ff5c8a;
    --rose:#ff2d55;
    --soft:#ffb3c8;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:var(--bg);}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",system-ui,sans-serif;
    color:var(--soft);
  }
  #stage{position:fixed;inset:0;display:block;}
  /* 顶部一句话 */
  .caption{
    position:fixed;left:0;right:0;top:6vh;text-align:center;
    pointer-events:none;user-select:none;
    letter-spacing:.35em;font-size:clamp(15px,2.4vw,22px);
    color:#ffd9e3;text-shadow:0 0 18px rgba(255,77,109,.55);
    opacity:0;animation:fadeIn 1.6s ease .4s forwards;
  }
  /* 底部落款 */
  .signature{
    position:fixed;left:0;right:0;bottom:5vh;text-align:center;
    pointer-events:none;user-select:none;
    font-size:clamp(13px,1.8vw,17px);letter-spacing:.25em;color:#e89aae;
    opacity:0;animation:fadeIn 1.6s ease 1.6s forwards;
  }
  @keyframes fadeIn{to{opacity:1;}}
  /* 点击重新聚拢 */
  .replay{
    position:fixed;right:18px;bottom:18px;z-index:10;
    background:rgba(255,77,109,.12);border:1px solid rgba(255,92,138,.45);
    color:#ffc2d1;border-radius:999px;padding:9px 16px;font-size:13px;
    letter-spacing:.1em;cursor:pointer;backdrop-filter:blur(6px);
    transition:background .2s,transform .2s;
  }
  .replay:hover{background:rgba(255,77,109,.28);transform:translateY(-1px);}
  .replay:focus-visible{outline:2px solid var(--pink);outline-offset:2px;}
  /* 音乐开关 */
  .music-btn{
    position:fixed;right:18px;top:18px;z-index:10;
    width:40px;height:40px;border-radius:50%;padding:0;
    background:rgba(255,77,109,.12);border:1px solid rgba(255,92,138,.45);
    color:#ffc2d1;cursor:pointer;display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(6px);transition:background .2s,transform .2s;
  }
  .music-btn:hover{background:rgba(255,77,109,.28);transform:translateY(-1px);}
  .music-btn:focus-visible{outline:2px solid var(--pink);outline-offset:2px;}
  .music-btn[disabled]{opacity:.4;cursor:default;}
  .music-btn svg{width:20px;height:20px;}
  .music-btn .ic-on{display:none;}
  .music-btn.playing .ic-on{display:block;}
  .music-btn.playing .ic-off{display:none;}
  /* 照片弹窗 */
  .lb{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;}
  .lb[hidden]{display:none;}
  .lb-backdrop{position:absolute;inset:0;background:rgba(5,4,8,.88);backdrop-filter:blur(4px);}
  .lb-figure{position:relative;max-width:90vw;max-height:86vh;display:flex;flex-direction:column;align-items:center;}
  #lb-img{max-width:86vw;max-height:74vh;border-radius:14px;border:1px solid rgba(255,157,184,.5);box-shadow:0 0 40px rgba(255,45,85,.35);object-fit:contain;}
  .lb-close{position:absolute;top:-16px;right:-16px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,157,184,.5);background:rgba(20,10,14,.9);color:#ffd9e3;font-size:18px;cursor:pointer;line-height:1;}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,157,184,.4);background:rgba(20,10,14,.7);color:#ffc2d1;font-size:22px;cursor:pointer;line-height:1;}
  .lb-prev{left:-54px;}
  .lb-next{right:-54px;}
  .lb-close:hover,.lb-nav:hover{background:rgba(255,77,109,.3);}
  .lb-figure figcaption{margin-top:12px;color:#ffd9e3;letter-spacing:.2em;font-size:14px;}
  #lb-count{margin-left:14px;color:#e89aae;font-size:12px;letter-spacing:.1em;}
  @media (max-width:640px){.lb-prev{left:6px;}.lb-next{right:6px;}}
  @media (prefers-reduced-motion: reduce){
    .caption,.signature{animation:none;opacity:1;}
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="由祝福文字组成的跳动爱心动画"></canvas>
<div class="caption">我把想说的话，都藏进这颗心里</div>
<div class="signature">—— 想你的每一天</div>
<button class="replay" id="replay" type="button">再看一次</button>
<audio id="bgm" loop preload="auto" src="bgm.mp3"></audio>
<button class="music-btn" id="musicBtn" type="button" aria-label="播放背景音乐" aria-pressed="false">
  <svg class="ic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
  <svg class="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
</button>

<div class="lb" id="lightbox" hidden>
  <div class="lb-backdrop" id="lb-backdrop"></div>
  <figure class="lb-figure">
    <button class="lb-close" id="lb-close" type="button" aria-label="关闭">×</button>
    <button class="lb-nav lb-prev" id="lb-prev" type="button" aria-label="上一张">‹</button>
    <img id="lb-img" alt="回忆照片">
    <button class="lb-nav lb-next" id="lb-next" type="button" aria-label="下一张">›</button>
    <figcaption><span id="lb-caption"></span><span id="lb-count"></span></figcaption>

</div>

  function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){
      var j=(Math.random()*(i+1))|0;
      var tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
    }
    return arr;
  }

  function roundRect(c, x, y, w, h, r){
    c.beginPath();
    c.moveTo(x+r, y);
    c.arcTo(x+w, y, x+w, y+h, r);
    c.arcTo(x+w, y+h, x, y+h, r);
    c.arcTo(x, y+h, x, y, r);
    c.arcTo(x, y, x+w, y, r);
    c.closePath();
  }

  /* 心形点位：与 py 版蒙版采样一致（轮廓点 / 内部点，标准坐标 y 向上） */

    return {edge:shuffle(edge), fill:shuffle(fill)};
  }

  function resize(){

    paintBackground();
    buildParticles();

    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }

  var EDGE_COLORS = ["#ff2d55","#ff4d6d","#ff5c8a"];
  var FILL_COLORS = ["#ff7fa5","#ff9db8","#ffb3c8"];
  var FLOATER_COLORS = EDGE_COLORS.concat(FILL_COLORS);

  function pickColor(edge){
    var pool = edge ? EDGE_COLORS : FILL_COLORS;
    return pool[(Math.random()*pool.length)|0];
  }

  function buildParticles(){
    particles = [];
    if(!heartGrid) heartGrid = buildHeartGrid();
    // 粒子数量随面积自适应，保证饱满但不卡死
    var count = Math.round(Math.min(400, Math.max(340, (W*H)/5000)));
    var edgeN = Math.round(count*0.45);
    var edgePts = heartGrid.edge.slice();
    var fillPts = heartGrid.fill.slice();
    // 轮廓点不够时从内部点借补
    while(edgePts.length < edgeN && fillPts.length) edgePts.push(fillPts.pop());
    for(var i=0;i<count;i++){
      var isEdge = i < edgeN;
      var p = isEdge ? edgePts[i] : fillPts[i-edgeN];
      if(!p) p = fillPts[0] || {x:0, y:0};
      var pool = isEdge ? EDGE_MESSAGES : MESSAGES;
      var msg = pool[(Math.random()*pool.length)|0];
      // 全屏散布目标（贴近四边铺满整个屏幕）
      var fx = W * (0.02 + Math.random()*0.96);
      var fy = H * (0.02 + Math.random()*0.96);
      particles.push({
        tx: p.x, ty: p.y, edge: isEdge,  // 目标（爱心坐标）
        fx: fx, fy: fy,                   // 全屏散布坐标
        x: fx, y: fy,
        text: msg,
        color: pickColor(isEdge),
        size: isEdge ? 10 + Math.random()*1 : 9 + Math.random()*1,
        // 相位：用于呼吸抖动
        phase: Math.random()*Math.PI*2,
        phaseSpeed: 0.6 + Math.random()*0.8,
        // 小概率放大字
        big: Math.random() < 0.08,
        photo: null,   // 挂载的照片（无则为普通文字粒子）
        box: null      // 高亮框命中区域
      });
    }
    assignPhotos();
    buildFloaters();
  }

  /* 随机挑一部分粒子挂上照片，分散在爱心里 */
  function assignPhotos(){
    lbList = [];
    var photoN = Math.min(PHOTOS.length, particles.length);
    var order = shuffle(particles.map(function(_, i){ return i; }));
    for(var k=0;k<photoN;k++){
      var pt = particles[order[k]];
      pt.photo = PHOTOS[k % PHOTOS.length];
      pt.text = PHOTO_MESSAGES[k % PHOTO_MESSAGES.length];
      pt.color = "#ffe9c2";
      pt.big = false;
      lbList.push(pt);
    }
  }

  function buildFloaters(){
    floaters = [];
    var n = Math.round(Math.min(26, Math.max(12, W/60)));
    for(var i=0;i<n;i++){
      floaters.push(newFloater(true));
    }
  }

  function newFloater(anywhere){
    return {
      x: Math.random()*W,
      y: anywhere ? Math.random()*H : H + 20,
      size: 8 + Math.random()*14,
      speed: 0.25 + Math.random()*0.5,
      drift: (Math.random()-0.5)*0.4,
      alpha: 0.25 + Math.random()*0.45,
      color: FLOATER_COLORS[(Math.random()*FLOATER_COLORS.length)|0],
      wobble: Math.random()*Math.PI*2
    };
  }

  function drawHeartShape(f, x, y, size, color, alpha){
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size/16, size/16);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, 4);
    ctx.bezierCurveTo(-9, -5, -4, -13, 0, -6);
    ctx.bezierCurveTo(4, -13, 9, -5, 0, 4);
    ctx.fill();
    ctx.restore();
  }

  function frame(now){
    var t = (now - startT)/1000;
    ctx.clearRect(0,0,W,H);
    paintBackground();

    // 漂浮小爱心
    for(var f=0;f<floaters.length;f++){
      var fl = floaters[f];
      fl.y -= fl.speed;
      fl.x += fl.drift + Math.sin(t*1.2 + fl.wobble)*0.25;
      fl.wobble += 0.02;
      if(fl.y < -30){ floaters[f] = newFloater(false); continue; }
      drawHeartShape(fl, fl.x, fl.y, fl.size, fl.color, fl.alpha);
    }

    // 心跳缩放：两段脉冲叠加
    var beat = 1 + 0.04*Math.sin(t*3.4) + 0.02*Math.max(0, Math.sin(t*6.8));
    var heartK = reduced ? 1 : heartFactor(t);

    // 文字粒子
    for(var i=0;i<particles.length;i++){
      var pt = particles[i];

      // 目标屏幕坐标（爱心 y 轴向下，故取负）
      var gx = centerX + pt.tx * scale * beat;
      var gy = centerY - pt.ty * scale * beat;

      // 呼吸偏移：聚拢时才保留轻微抖动
      var breathe = reduced ? 0 : Math.sin(t*pt.phaseSpeed + pt.phase)*0.8*heartK;

      var cx = pt.fx + (gx - pt.fx)*heartK;
      var cy = pt.fy + (gy - pt.fy)*heartK;
      pt.x = cx; pt.y = cy + breathe;

      ctx.save();
      ctx.globalAlpha = reduced ? 1 : (0.55 + 0.45*heartK);
      ctx.font = (pt.big ? 700 : 500) + " " + pt.size + "px " +
                 '"Microsoft YaHei","PingFang SC",system-ui,sans-serif';
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      if(pt.photo){
        var tw = ctx.measureText(pt.text).width;
        var bw = tw + 14, bh = pt.size + 9;
        pt.box = {w:bw, h:bh};
        var isHover = pt === hoverPt;
        ctx.shadowColor = "rgba(255,209,102,.85)";
        ctx.shadowBlur = isHover ? 12 : 7;
        roundRect(ctx, pt.x-bw/2, pt.y-bh/2, bw, bh, 7);
        ctx.fillStyle = isHover ? "rgba(255,209,102,.25)" : "rgba(255,209,102,.13)";
        ctx.fill();
        ctx.lineWidth = 1.4;
        ctx.strokeStyle = "#ffd98a";
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#ffe9c2";
        ctx.fillText(pt.text, pt.x, pt.y);
      } else {
        pt.box = null;
        ctx.fillStyle = pt.color;
        ctx.fillText(pt.text, pt.x, pt.y);
      }
      ctx.restore();
    }

    requestAnimationFrame(frame);
  }

  function replay(){
    closeLightbox();
    startT = performance.now();
    buildParticles();
  }

  /* ===== 照片弹窗 ===== */
  var lb = document.getElementById("lightbox");
  var lbImg = document.getElementById("lb-img");
  var lbCaption = document.getElementById("lb-caption");
  var lbCount = document.getElementById("lb-count");

  function particleAt(mx, my){
    for(var i=0;i<particles.length;i++){
      var pt = particles[i];
      if(!pt.photo || !pt.box) continue;
      if(Math.abs(mx-pt.x) <= pt.box.w/2 + 4 &&
         Math.abs(my-pt.y) <= pt.box.h/2 + 4) return pt;
    }
    return null;
  }

  function renderLb(){
    if(!lbList.length) return;
    var pt = lbList[lbIndex];
    lbImg.src = pt.photo.src;
    lbCaption.textContent = pt.text;
    lbCount.textContent = (lbIndex+1) + " / " + lbList.length;
  }

  function openLightbox(i){
    if(!lbList.length) return;
    lbIndex = (i + lbList.length) % lbList.length;
    renderLb();
    lb.hidden = false;
  }

  function closeLightbox(){
    lb.hidden = true;
    lbImg.src = "";
  }

  function stepLb(dir){
    lbIndex = (lbIndex + dir + lbList.length) % lbList.length;
    renderLb();
  }

  canvas.addEventListener("mousemove", function(e){
    var r = canvas.getBoundingClientRect();
    var pt = particleAt(e.clientX - r.left, e.clientY - r.top);
    hoverPt = pt;
    canvas.style.cursor = pt ? "pointer" : "default";
  });
  canvas.addEventListener("click", function(e){
    var r = canvas.getBoundingClientRect();
    var pt = particleAt(e.clientX - r.left, e.clientY - r.top);
    if(pt) openLightbox(lbList.indexOf(pt));
  });

  document.getElementById("lb-close").addEventListener("click", closeLightbox);
  document.getElementById("lb-backdrop").addEventListener("click", closeLightbox);
  document.getElementById("lb-prev").addEventListener("click", function(e){ e.stopPropagation(); stepLb(-1); });
  document.getElementById("lb-next").addEventListener("click", function(e){ e.stopPropagation(); stepLb(1); });
  window.addEventListener("keydown", function(e){
    if(lb.hidden) return;
    if(e.key === "Escape") closeLightbox();
    else if(e.key === "ArrowLeft") stepLb(-1);
    else if(e.key === "ArrowRight") stepLb(1);
  });

  window.addEventListener("resize", resize);
  document.getElementById("replay").addEventListener("click", replay);

  /* ===== 背景音乐（需点击后播放，不自动出声） ===== */
  var bgm = document.getElementById("bgm");
  var musicBtn = document.getElementById("musicBtn");
  bgm.volume = 0.4;

  function setMusicUI(on){
    musicBtn.classList.toggle("playing", on);
    musicBtn.setAttribute("aria-pressed", on ? "true" : "false");
    musicBtn.setAttribute("aria-label", on ? "暂停背景音乐" : "播放背景音乐");
  }
  function toggleMusic(){
    if(reduced) return; // 减弱动态效果：不启用音频
    if(bgm.paused){
      var p = bgm.play();
      if(p && p.catch) p.catch(function(){ setMusicUI(false); });
    } else {
      bgm.pause();
    }
  }
  musicBtn.addEventListener("click", toggleMusic);
  bgm.addEventListener("play", function(){ setMusicUI(true); });
  bgm.addEventListener("pause", function(){ setMusicUI(false); });
  bgm.addEventListener("error", function(){ musicBtn.disabled = true; });
  if(reduced){ musicBtn.disabled = true; }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
